schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: minimax-m3.1-flash-fp8
    tokenizer: minimax-m3.1-flash-fp8
  hf_model_id: T-HEAD/MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: minimax-m3.1-flash-fp8
  served_name: MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 8
  default_features:
    - tool_calling
    - reasoning
  external_env:
    - HGGC_EMBEDDED_COPY_THRESHOLD
model:
  model_id: MiniMaxAI/MiniMax-M3.1-Flash
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "8"
    - --block-size
    - "128"
    - --kv-cache-dtype
    - fp8
    - --gpu-memory-utilization
    - "0.9"
    - --max-model-len
    - "16384"
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env: {}
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - minimax_m3
  reasoning:
    args:
      - --reasoning-parser
      - minimax_m3
  spec_decoding:
    default_mode: dspark
    modes:
      dspark:
        args:
          - --speculative-config
          - '{"method": "dspark", "num_speculative_tokens": 7, "draft_sample_method": "probabilistic", "rejection_sample_method": "block"}'
variants:
  default:
    precision: fp8
    hardware: zhenwu_m890
    assets:
      model: minimax-m3.1-flash-fp8
      tokenizer: minimax-m3.1-flash-fp8
    hf_model_id: T-HEAD/MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
    golden_model_key: minimax-m3.1-flash-fp8
    served_name: MiniMax-M3.1-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
    extra_args: []
    extra_env: {}
  w8a8_int8:
    precision: w8a8_int8
    hardware: zhenwu_810e
    topology:
      kind: single_node
      nodes: 1
      devices_per_node: 8
    assets:
      model: minimax-m3.1-flash-w8a8-int8
      tokenizer: minimax-m3.1-flash-w8a8-int8
    hf_model_id: T-HEAD/MiniMax-M3.1-Flash-W8A8-INT8
    golden_model_key: minimax-m3.1-flash-w8a8-int8
    served_name: minimax-m3.1-flash-w8a8-int8
    extra_args:
      - --kv-cache-dtype
      - bfloat16
    extra_env: {}
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill:
    select:
      features:
        spec_decoding: false
    args: []
  decode:
    remove_args:
      - --tensor-parallel-size
    select:
      features:
        spec_decoding: true
    args:
      - --data-parallel-size
      - "8"
      - --enable-expert-parallel
      - --all2all-backend
      - deepep_low_latency
      - --max-num-batched-tokens
      - "1024"
    env:
      HGGC_EMBEDDED_COPY_THRESHOLD: "0x10000"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      VLLM_PROCESS_GROUP_TIMEOUT_M: "60"
  prefill_long:
    hardware: zhenwu_m890
    args: []
  eval_longctx:
    hardware: zhenwu_m890
    args: []
notes: >-
  Default serving configuration aligns with the single-node 8-card Zhenwu M890
  FP8 baseline (TP8, FP8 KV cache, block size 128, 16K context window, and
  MiniMax M3 tool-call/reasoning parsers). Static catalog entries add standard
  prefill/decode slots and the 8-card Zhenwu 810E w8a8_int8 variant. Prefix
  caching is controlled by the test policy.
