schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: glm-5.3-flash-mxfp4
    tokenizer: glm-5.3-flash-mxfp4
  hf_model_id: T-HEAD/GLM-5.3-Flash-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: glm_5_3_flash_mxfp4
  served_name: glm-5.3-flash-mxfp4
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 2
  default_features:
    - tool_calling
    - reasoning
  external_env: []
model:
  model_id: zai-org/GLM-5.3-Flash
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "2"
    - --block-size
    - "256"
    - --max-model-len
    - "16384"
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env: {}
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - glm47
  reasoning:
    args:
      - --reasoning-parser
      - glm45
  spec_decoding:
    default_mode: mtp
    modes:
      mtp:
        args:
          - --speculative-config
          - '{"method":"mtp","num_speculative_tokens":2}'
variants:
  default:
    precision: mxfp4
    hardware: zhenwu_m890
    assets:
      model: glm-5.3-flash-mxfp4
      tokenizer: glm-5.3-flash-mxfp4
    hf_model_id: T-HEAD/GLM-5.3-Flash-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
    golden_model_key: glm_5_3_flash_mxfp4
    served_name: glm-5.3-flash-mxfp4
    extra_args: []
    extra_env: {}
  fp8:
    precision: fp8
    hardware: zhenwu_m890
    topology:
      kind: single_node
      nodes: 1
      devices_per_node: 4
    assets:
      model: glm-5.3-flash-fp8
      tokenizer: glm-5.3-flash-fp8
    hf_model_id: T-HEAD/GLM-5.3-Flash-Quant-W-FP8-PerChannel-A-FP8-PerToken
    golden_model_key: glm_5_3_flash_fp8
    served_name: glm-5.3-flash-fp8
    extra_args:
      - --tensor-parallel-size
      - "4"
    extra_env: {}
  w8a8_int8:
    precision: w8a8_int8
    hardware: zhenwu_810e
    topology:
      kind: single_node
      nodes: 1
      devices_per_node: 16
    assets:
      model: glm-5.3-flash-w8a8-int8
      tokenizer: glm-5.3-flash-w8a8-int8
    hf_model_id: T-HEAD/GLM-5.3-Flash-W8A8-INT8
    golden_model_key: glm_5_3_flash_w8a8_int8
    served_name: glm-5.3-flash-w8a8-int8
    extra_args:
      - --tensor-parallel-size
      - "16"
    extra_env: {}
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill:
    select:
      features:
        spec_decoding: false
    args: []
  decode:
    select:
      features:
        spec_decoding: true
    args: []
  dp_ep_low_latency:
    hardware: zhenwu_m890
    topology:
      kind: single_node
      nodes: 1
      devices_per_node: 8
    remove_args:
      - --tensor-parallel-size
    select:
      features:
        spec_decoding: true
    args:
      - --data-parallel-size
      - "8"
      - --enable-expert-parallel
      - --all2all-backend
      - deepep_low_latency
      - --gpu-memory-utilization
      - "0.95"
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: "6000"
      VLLM_PROCESS_GROUP_TIMEOUT_M: "60"
notes: >-
  Default baseline preserves the 2-card Zhenwu M890 MXFP4 TP2 policy. Static
  catalog entries add M890 FP8 (TP4), Zhenwu 810E w8a8_int8 (TP16), standard
  prefill/decode slots with MTP speculative decoding, and single-node DP8+EP.
