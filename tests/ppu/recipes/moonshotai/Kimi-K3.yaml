schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: kimi-k3-mxfp4
    tokenizer: kimi-k3-mxfp4
  hf_model_id: T-HEAD/Kimi-K3-MXFP4-FP8
  golden_model_key: kimi_k3_mxfp4
  served_name: kimi-k3-mxfp4
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 8
  default_features:
    - tool_calling
    - reasoning
  external_env:
    - DG_USE_MOE_DYNAMIC_TILE
    - HGGC_EMBEDDED_COPY_THRESHOLD
model:
  model_id: moonshotai/Kimi-K3
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "8"
    - --disable-custom-all-reduce
    - --gpu-memory-utilization
    - "0.95"
    - --max-model-len
    - auto
    - --max-num-seqs
    - "96"
    - --moe-backend
    - ppu_deep_gemm_w4a16
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env:
    VLLM_PROCESS_GROUP_TIMEOUT_M: "60"
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - kimi_k3
  reasoning:
    args:
      - --reasoning-parser
      - kimi_k3
variants:
  default:
    precision: mxfp4
    hardware: zhenwu_m890
    assets:
      model: kimi-k3-mxfp4
      tokenizer: kimi-k3-mxfp4
    hf_model_id: T-HEAD/Kimi-K3-MXFP4-FP8
    golden_model_key: kimi_k3_mxfp4
    served_name: kimi-k3-mxfp4
    extra_args: []
    extra_env:
      DG_USE_MOE_DYNAMIC_TILE: "1"
      HGGC_EMBEDDED_COPY_THRESHOLD: "0x10000"
      VLLM_ENGINE_READY_TIMEOUT_S: "60000"
      VLLM_USE_V2_MODEL_RUNNER: "0"
  w4a8_int8:
    precision: w4a8_int8
    hardware: zhenwu_810e
    topology:
      kind: single_node
      nodes: 1
      devices_per_node: 16
    assets:
      model: kimi-k3-w4a8-int8
      tokenizer: kimi-k3-w4a8-int8
    hf_model_id: T-HEAD/Kimi-K3-W4A8-INT8
    golden_model_key: kimi_k3_w4a8_int8
    served_name: kimi-k3-w4a8-int8
    extra_args:
      - --tensor-parallel-size
      - "16"
    extra_env:
      VLLM_ENGINE_READY_TIMEOUT_S: "6000"
      VLLM_PPU_DENSE_BACKEND: triton
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill:
    args: []
  decode_ep:
    hardware: zhenwu_m890
    topology:
      kind: multi_node_ep
      nodes: 4
      devices_per_node: 8
    args:
      - --data-parallel-size
      - "4"
      - --tensor-parallel-size
      - "8"
      - --enable-expert-parallel
      - --all2all-backend
      - deepep_low_latency
      - --max-num-seqs
      - "32"
      - --nnodes
      - "4"
      - --node-rank
      - "{node_rank}"
      - --master-addr
      - "{master_addr}"
    env:
      VLLM_DEEPEPLL_RECV_HOOK: "0"
      VLLM_DEEPEP_LOW_LATENCY_USE_MNNVL: "1"
      VLLM_ENABLE_K3_LATENT_MOE_TAIL_FUSION: "0"
notes: >-
  Static catalog recipe for moonshotai/Kimi-K3 covering Zhenwu M890 MXFP4
  (single-node TP8 prefill and 4-node DP4+TP8+EP decode_ep) and Zhenwu 810E
  W4A8 INT8 (TP16 prefill) without disaggregated PD presets.
