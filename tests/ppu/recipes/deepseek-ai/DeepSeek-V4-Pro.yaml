schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: deepseek-v4-pro-mxfp4
    tokenizer: deepseek-v4-pro-mxfp4
  hf_model_id: T-HEAD/DeepSeek-V4-Pro-0813-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: deepseek_v4_pro_mxfp4
  served_name: deepseek-v4-pro-mxfp4
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 8
  default_features:
    - tool_calling
    - reasoning
  external_env: []
model:
  model_id: deepseek-ai/DeepSeek-V4-Pro
  base_args:
    - --trust-remote-code
    - --tensor-parallel-size
    - "8"
    - --block-size
    - "256"
    - --kv-cache-dtype
    - fp8
    - --gpu-memory-utilization
    - "0.95"
    - --max-model-len
    - auto
    - --compilation-config
    - '{"cudagraph_mode":"FULL_DECODE_ONLY","mode":0}'
    - --distributed-timeout-seconds
    - "3600"
    - --cpu-distributed-timeout-seconds
    - "3600"
  base_env:
    VLLM_ENGINE_READY_TIMEOUT_S: "6000"
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
  reasoning:
    args:
      - --tokenizer-mode
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
  spec_decoding:
    default_mode: mtp
    modes:
      mtp:
        args:
          - --speculative-config
          - '{"method":"mtp","num_speculative_tokens":2}'
      dspark:
        args:
          - --speculative-config
          - '{"method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic"}'
variants:
  default:
    precision: mxfp4
    hardware: zhenwu_m890
    assets:
      model: deepseek-v4-pro-mxfp4
      tokenizer: deepseek-v4-pro-mxfp4
    hf_model_id: T-HEAD/DeepSeek-V4-Pro-0813-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
    golden_model_key: deepseek_v4_pro_mxfp4
    served_name: deepseek-v4-pro-mxfp4
    extra_args: []
    extra_env: {}
  w8a8_int8:
    precision: w8a8_int8
    hardware: zhenwu_810e
    topology:
      kind: single_node
      nodes: 1
      devices_per_node: 16
    assets:
      model: deepseek-v4-pro-w8a8-int8
      tokenizer: deepseek-v4-pro-w8a8-int8
    hf_model_id: T-HEAD/DeepSeek-V4-Pro-0813-W8A8-INT8
    golden_model_key: deepseek_v4_pro_w8a8_int8
    served_name: deepseek-v4-pro-w8a8-int8
    extra_args:
      - --tensor-parallel-size
      - "16"
      - --gpu-memory-utilization
      - "0.9"
      - --max-num-seqs
      - "32"
    extra_env:
      VLLM_PROCESS_GROUP_TIMEOUT_M: "60"
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill:
    select:
      features:
        spec_decoding: false
    args: []
  decode:
    select:
      features:
        spec_decoding: true
    args: []
  prefill_long:
    hardware: zhenwu_m890
    select:
      features:
        spec_decoding: false
    args: []
  eval_longctx:
    hardware: zhenwu_m890
    args: []
notes: >-
  Default serving configuration aligns with the P0 single-node 8-card Zhenwu M890
  performance baseline (TP8, FP8 KV cache, block size 256, FULL_DECODE_ONLY
  compilation config, and DeepSeek V4 parsers). Static catalog entries add
  prefill/decode slots and the 16-card Zhenwu 810E w8a8_int8 variant. Prefix
  caching is controlled by the test policy.
